<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Meadow - Grade 1 Math Party! 🎈</title>
    <link rel="icon" type="image/png" href="happymeadow_logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka for cute rounded kids typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Fredoka', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .sky-meadow-bg {
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #dcfce7 100%);
        }
        .bubble-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="h-full sky-meadow-bg text-slate-700 flex flex-col font-sans antialiased selection:bg-pink-400 selection:text-white">

    <!-- Cheerful Top Header -->
    <header class="bg-white/80 backdrop-blur-md border-b-4 border-sky-200 sticky top-0 z-50 px-6 py-3 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div onclick="meadowApp.goHome()" class="flex items-center space-x-3 cursor-pointer group">
                <div class="w-12 h-12 rounded-2xl overflow-hidden shadow-md group-hover:rotate-12 transition-transform bg-white border-2 border-amber-300 flex items-center justify-center">
                  <img src="happymeadow_logo.png" alt="My Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-sky-700">Happy Meadow</h1>
                    <span class="text-xs font-semibold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full">Grade 1 Math Party</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="meadowApp.goHome()" class="hidden sm:flex items-center space-x-2 bg-sky-100 hover:bg-sky-200 text-sky-700 px-4 py-2 rounded-2xl font-bold text-sm transition shadow-sm cursor-pointer">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </button>
                <div class="flex items-center space-x-2 bg-gradient-to-r from-amber-400 to-yellow-400 text-slate-900 px-4 py-2 rounded-2xl shadow-md font-bold text-sm border-2 border-white">
                    <span class="text-lg">⭐</span>
                    <span id="star-counter">0 Stars</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Game Viewport -->
    <main id="app-container" class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-center">
        <!-- Dynamic content goes here -->
    </main>

    <!-- Cheerful Footer -->
    <footer class="text-center py-4 text-xs font-semibold text-sky-700/60">
        Happy Meadow Learning Park • Made with love for Grade 1 Explorers 🌸
    </footer>

    <!-- Celebration Popup Modal -->
    <div id="celebration-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bubble-card p-8 max-w-sm w-full mx-4 rounded-3xl text-center border-4 border-yellow-300 shadow-2xl">
            <div class="text-6xl mb-4 animate-bounce">🎉</div>
            <h3 id="modal-title" class="text-2xl font-bold text-sky-800 mb-2">Wonderful Job!</h3>
            <p id="modal-desc" class="text-slate-600 font-medium mb-6">You earned shiny stars for completing this fun adventure!</p>
            <button onclick="meadowApp.closeModal()" class="w-full py-3.5 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold text-lg rounded-2xl shadow-lg shadow-emerald-400/30 transition cursor-pointer">
                Play More Games! 🎈
            </button>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        const playgroundAreas = [
            {
                id: 'counting',
                name: 'Apple Orchard',
                subtitle: 'Count up to 20',
                icon: '🍎',
                bgGradient: 'from-pink-100 to-rose-100',
                borderColor: 'border-rose-300',
                textColor: 'text-rose-700',
                desc: 'Pick juicy red apples and count friendly animal friends in the meadow!',
                challenges: [
                    { prompt: 'How many juicy apples are on the tree?', visual: '🍎 🍎 🍎 🍎 🍎', target: 5, options: [4, 5, 6] },
                    { prompt: 'Count the buzzing bumblebees!', visual: '🐝 🐝 🐝 🐝 🐝 🐝 🐝 🐝', target: 8, options: [7, 8, 9] },
                    { prompt: 'How many bouncing frogs do you see?', visual: '🐸 🐸 🐸 🐸', target: 4, options: [3, 4, 5] },
                    { prompt: 'Which number is bigger: 9 or 6?', visual: '🌸', target: '9', options: ['6', '9', '5'] },
                    { prompt: 'What number comes next? 10, 11, 12, ?', visual: '🌼', target: '13', options: ['13', '11', '14'] }
                ]
            },
            {
                id: 'addition',
                name: 'Bouncy Addition',
                subtitle: 'Add things together',
                icon: '🐸',
                bgGradient: 'from-emerald-100 to-teal-100',
                borderColor: 'border-emerald-300',
                textColor: 'text-emerald-700',
                desc: 'Hop along with cute frogs and put groups together to find the sum!',
                challenges: [
                    { prompt: 'Add flowers: 3 + 2 = ?', visual: '🌸 🌸 🌸  +  🌸 🌸', target: 5, options: [4, 5, 6] },
                    { prompt: 'Add balloons: 4 + 4 = ?', visual: '🎈 🎈 🎈 🎈  +  🎈 🎈 🎈 🎈', target: 8, options: [7, 8, 9] },
                    { prompt: 'Math magic: 1 + 6 = ?', visual: '⭐', target: 7, options: [6, 7, 8] },
                    { prompt: 'Math magic: 5 + 3 = ?', visual: '🌟', target: 8, options: [7, 8, 9] },
                    { prompt: 'Math magic: 2 + 7 = ?', visual: '🌈', target: 9, options: [8, 9, 10] }
                ]
            },
            {
                id: 'subtraction',
                name: 'Butterfly Subtraction',
                subtitle: 'Take away & find rest',
                icon: '🦋',
                bgGradient: 'from-sky-100 to-indigo-100',
                borderColor: 'border-sky-300',
                textColor: 'text-sky-700',
                desc: 'Watch butterflies flutter away and count how many remain in the garden.',
                challenges: [
                    { prompt: 'Butterflies flying away: 6 - 2 = ?', visual: '🦋 🦋 🦋 🦋 🦋 🦋 (fly away 2)', target: 4, options: [3, 4, 5] },
                    { prompt: 'Flowers picked: 5 - 3 = ?', visual: '🌷 🌷 🌷 🌷 🌷 (take 3)', target: 2, options: [1, 2, 3] },
                    { prompt: 'Subtract stars: 7 - 4 = ?', visual: '⭐', target: 3, options: [2, 3, 4] },
                    { prompt: 'Subtract stars: 8 - 1 = ?', visual: '⭐', target: 7, options: [6, 7, 8] },
                    { prompt: 'Subtract stars: 4 - 0 = ?', visual: '⭐', target: 4, options: [3, 4, 5] }
                ]
            },
            {
                id: 'shapes',
                name: 'Shape Playground',
                subtitle: 'Circles, squares & more',
                icon: '⭐',
                bgGradient: 'from-amber-100 to-yellow-100',
                borderColor: 'border-amber-300',
                textColor: 'text-amber-700',
                desc: 'Discover fun shapes hidden all around the sunny playground!',
                challenges: [
                    { prompt: 'Which shape has 3 straight sides like a party hat?', visual: '🔺 🟦 ⭕', target: 'Triangle', options: ['Circle', 'Triangle', 'Square'] },
                    { prompt: 'Which shape looks like a round cookie?', visual: '🍪', target: 'Circle', options: ['Square', 'Circle', 'Triangle'] },
                    { prompt: 'How many corners does a square box have?', visual: '📦', target: '4', options: ['3', '4', '5'] },
                    { prompt: 'Which shape has 4 equal straight sides?', visual: '🟨', target: 'Square', options: ['Triangle', 'Square', 'Circle'] },
                    { prompt: 'What comes next in the pattern? 🌸 🌼 🌸 🌼 ?', visual: '🌻', target: '🌸', options: ['🌸', '🌼', '🌻'] }
                ]
            }
        ];

        class HappyMeadowApp {
            constructor() {
                this.loadUserData();
                this.currentView = 'home';
                this.activeAreaId = null;
                this.challengeIndex = 0;
                this.scoreEarned = 0;
                this.render();
            }

            loadUserData() {
                const data = localStorage.getItem('happy_meadow_save_v1');
                this.progress = data ? JSON.parse(data) : {};
            }

            saveUserData() {
                localStorage.setItem('happy_meadow_save_v1', JSON.stringify(this.progress));
                this.updateStarTotal();
            }

            getTotalStars() {
                let total = 0;
                for (let id in this.progress) {
                    total += (this.progress[id]?.stars || 0);
                }
                return total;
            }

            updateStarTotal() {
                const el = document.getElementById('star-counter');
                if (el) el.innerText = `${this.getTotalStars()} Stars`;
            }

            goHome() {
                this.currentView = 'home';
                this.activeAreaId = null;
                this.render();
            }

            startPlayground(id) {
                this.currentView = 'game';
                this.activeAreaId = id;
                this.challengeIndex = 0;
                this.scoreEarned = 0;
                this.render();
            }

            checkAnswer(selected, correct) {
                const feedbackBox = document.getElementById('game-feedback');
                const buttons = document.querySelectorAll('.ans-btn');
                buttons.forEach(b => b.disabled = true);

                if (String(selected) === String(correct)) {
                    this.scoreEarned += 2;
                    feedbackBox.innerHTML = `
                        <div class="p-4 bg-emerald-100 border-2 border-emerald-300 rounded-2xl text-emerald-800 font-bold text-center text-lg animate-bounce">
                            🎉 Yay! That is super correct! (+2 Stars)
                        </div>
                    `;
                } else {
                    feedbackBox.innerHTML = `
                        <div class="p-4 bg-rose-100 border-2 border-rose-300 rounded-2xl text-rose-800 font-bold text-center text-lg">
                            ❌ Oopsie! Let's try the next fun challenge!
                        </div>
                    `;
                }

                setTimeout(() => {
                    const area = playgroundAreas.find(a => a.id === this.activeAreaId);
                    this.challengeIndex++;
                    if (this.challengeIndex < area.challenges.length) {
                        this.renderGameStage();
                    } else {
                        this.finishPlayground();
                    }
                }, 1500);
            }

            finishPlayground() {
                const id = this.activeAreaId;
                if (!this.progress[id]) this.progress[id] = { stars: 0, completed: false };

                this.progress[id].stars = Math.max(this.progress[id].stars, this.scoreEarned);
                this.progress[id].completed = true;
                this.saveUserData();

                const modal = document.getElementById('celebration-modal');
                const title = document.getElementById('modal-title');
                const desc = document.getElementById('modal-desc');
                title.innerText = "You Completed the Game! 🌟";
                desc.innerText = `Super star! You earned ${this.scoreEarned} shiny stars in this fun playground area!`;
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            }

            closeModal() {
                const modal = document.getElementById('celebration-modal');
                modal.classList.add('opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    this.goHome();
                }, 300);
            }

            render() {
                this.updateStarTotal();
                const container = document.getElementById('app-container');
                if (this.currentView === 'home') {
                    container.innerHTML = this.getHomeHTML();
                } else if (this.currentView === 'game') {
                    container.innerHTML = this.getGameContainerHTML();
                }
            }

            renderGameStage() {
                const stage = document.getElementById('game-stage-wrap');
                if (stage) stage.innerHTML = this.getGameInnerHTML();
            }

            getHomeHTML() {
                return `
                    <!-- Cheerful Welcome Banner -->
                    <div class="bubble-card rounded-3xl p-8 mb-8 text-center md:text-left flex flex-col md:flex-row items-center justify-between border-4 border-white shadow-xl relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 text-9xl opacity-10 select-none pointer-events-none">
                            🌈
                        </div>
                        <div class="max-w-md z-10 mb-6 md:mb-0">
                            <span class="bg-pink-100 text-pink-700 border-2 border-pink-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider mb-3 inline-block">
                                🎒 Grade 1 Fun Learning
                            </span>
                            <h2 class="text-3xl font-bold text-sky-800 mb-2">Welcome to Happy Meadow!</h2>
                            <p class="text-slate-600 font-medium text-sm leading-relaxed">Choose a fun game world below to start playing, counting, and collecting shiny stars!</p>
                        </div>
                        <div class="bg-gradient-to-br from-amber-200 to-yellow-300 p-6 rounded-3xl text-center min-w-[160px] border-4 border-white shadow-md z-10">
                            <span class="text-xs font-bold text-amber-800 block uppercase tracking-wider mb-1">Total Stars</span>
                            <div class="text-3xl font-extrabold text-amber-900 flex items-center justify-center space-x-1">
                                <span>⭐</span>
                                <span>${this.getTotalStars()}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Playground Areas Grid -->
                    <h3 class="text-xl font-bold text-sky-800 mb-5 flex items-center">
                        <span class="mr-2 text-2xl">🎪</span> Choose a Fun Adventure Area
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${playgroundAreas.map(area => {
                            const data = this.progress[area.id] || { stars: 0, completed: false };
                            return `
                                <div onclick="meadowApp.startPlayground('${area.id}')" class="bubble-card rounded-3xl p-6 hover:scale-[1.02] transition-all duration-300 flex flex-col justify-between cursor-pointer group shadow-lg border-4 border-white">
                                    <div>
                                        <div class="flex items-center justify-between mb-4">
                                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${area.bgGradient} flex items-center justify-center text-3xl shadow-md border-2 border-white group-hover:rotate-6 transition-transform">
                                                ${area.icon}
                                            </div>
                                            <span class="px-3.5 py-1.5 rounded-full text-xs font-bold border-2 ${data.completed ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-sky-100 text-sky-700 border-sky-300'}">
                                                ${data.completed ? '🎉 Finished!' : '✨ Let’s Play'}
                                            </span>
                                        </div>
                                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${area.subtitle}</span>
                                        <h4 class="text-2xl font-bold ${area.textColor} mt-1 mb-2">${area.name}</h4>
                                        <p class="text-sm text-slate-600 font-medium mb-6">${area.desc}</p>
                                    </div>
                                    <div class="flex items-center justify-between pt-4 border-t-2 border-slate-100">
                                        <span class="text-sm font-bold text-amber-600 flex items-center space-x-1">
                                            <span>⭐</span>
                                            <span>${data.stars} Stars</span>
                                        </span>
                                        <span class="bg-sky-500 hover:bg-sky-600 text-white text-sm font-bold px-5 py-2.5 rounded-2xl shadow-md transition">
                                            Start Game! 🚀
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            getGameContainerHTML() {
                return `
                    <div id="game-stage-wrap">
                        ${this.getGameInnerHTML()}
                    </div>
                `;
            }

            getGameInnerHTML() {
                const area = playgroundAreas.find(a => a.id === this.activeAreaId);
                if (!area) return '<div>Area not found</div>';

                const chal = area.challenges[this.challengeIndex];
                const total = area.challenges.length;
                const progressPercent = Math.round((this.challengeIndex / total) * 100);

                return `
                    <div class="max-w-lg mx-auto w-full">
                        <!-- Game Header Navigation -->
                        <div class="flex justify-between items-center mb-6">
                            <button onclick="meadowApp.goHome()" class="bubble-card hover:bg-white text-sky-700 px-4 py-2 rounded-2xl text-sm font-bold transition flex items-center space-x-2 cursor-pointer shadow-sm border-2 border-white">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Back to Home</span>
                            </button>
                            <span class="text-xs font-bold bg-pink-100 text-pink-700 border-2 border-pink-200 px-4 py-2 rounded-full uppercase tracking-wider">
                                Question ${this.challengeIndex + 1} of ${total}
                            </span>
                        </div>

                        <!-- Cute Progress Bar -->
                        <div class="w-full bubble-card h-4 rounded-full overflow-hidden p-0.5 mb-6 border-2 border-white">
                            <div class="bg-gradient-to-r from-pink-400 to-yellow-400 h-full rounded-full transition-all duration-500" style="width: ${progressPercent}%"></div>
                        </div>

                        <!-- Big Cheerful Question Card -->
                        <div class="bubble-card rounded-3xl p-8 border-4 border-white shadow-2xl text-center">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${area.bgGradient} flex items-center justify-center text-3xl mx-auto mb-5 shadow-md border-2 border-white">
                                ${area.icon}
                            </div>
                            
                            <h4 class="text-xl font-bold text-slate-800 mb-6">${chal.prompt}</h4>

                            <div class="bubble-card border-2 border-white rounded-2xl p-6 mb-6 text-4xl tracking-widest flex items-center justify-center min-h-[110px] shadow-inner bg-white/60">
                                ${chal.visual}
                            </div>

                            <div id="game-feedback" class="mb-6"></div>

                            <!-- Big Friendly Choice Buttons -->
                            <div class="grid grid-cols-3 gap-4">
                                ${chal.options.map(opt => `
                                    <button onclick="meadowApp.checkAnswer('${opt}', '${chal.target}')" class="ans-btn bubble-card hover:bg-sky-50 text-sky-800 font-extrabold text-2xl py-5 rounded-2xl border-4 border-white shadow-md transition cursor-pointer active:scale-95">
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize the app
        const meadowApp = new HappyMeadowApp();
    </script>
</body>
</html>
